name: PR Builder for MahjongHelper

on:
  pull_request:
    branches: [ master ]

jobs:

  build:
    runs-on: windows-2022

    env:
      Solution_Name: MahjongHelper

    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Unit tests (cfg parser)
      run: dotnet test MahjongHelper.Tests/MahjongHelper.Tests.csproj --configuration Release

    - name: Download Dalamud
      run: |
        $ErrorActionPreference = 'Stop'
        $uri = 'https://goatcorp.github.io/dalamud-distrib/latest.zip'
        $out = 'latest.zip'
        $dest = "$env:AppData\XIVLauncher\addon\Hooks\dev"
        foreach ($attempt in 1..5) {
          try {
            if (Test-Path $out) { Remove-Item $out -Force }
            Invoke-WebRequest -Uri $uri -OutFile $out
            Expand-Archive -Force $out $dest
            break
          } catch {
            Write-Host "Dalamud download attempt $attempt failed: $_"
            if ($attempt -eq 5) { throw }
            Start-Sleep -Seconds ([int][math]::Pow(2, $attempt + 1))
          }
        }

    - name: Build with dotnet
      run: dotnet build --configuration Release

    - name: Store artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MahjongHelper
        path: .\MahjongHelper\bin\x64\Release\MahjongHelper\*
        if-no-files-found: error
        retention-days: 1

